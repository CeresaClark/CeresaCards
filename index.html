<html>

<head>
    <title>【禁忌契約-血月降臨】限定UR希瑞莎抽卡</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="mainWrap">
        <div class="mainBg"></div>
        <video src="img/bg.mp4" autoplay loop></video>
        <div class="spark" id="particles-js"></div>
        <div class="mainTitle"></div>
        <div class="name"></div>
        <div class="limited"></div>
        <div class="rate"></div>
        <div class="note"></div>
        <div class="btns">
            <div id="btn1"></div>
            <div id="btn10"></div>
        </div>
    </div>

    <div class="event">
        <div class="eventBG">
            <div class="c1"></div>
            <div class="c2"></div>
        </div>
        <div class="roll"></div>
        <div class="light"></div>
        <div class="UReffect"></div>
    </div>

    <div class="pop">
        <span>請按下「F11」進入全螢幕遊玩<br />手機及非全螢幕將產生跑版可能</span>
        <div id="ok">我知道了</div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        particlesJS.load('particles-js', 'js/particlesjs-config.json', function () {
            console.log('callback - particles.js config loaded');
        });
    </script>
</body>

</html>
